<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="dash_title">Dashboard · Ernesto Investing AI</title><link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script></head>
<body data-page="dashboard"><main>
<h1 data-i18n="dash_title">Dashboard de mercado</h1>
<p id="dashboard-alert-count" class="mut" role="status" aria-live="polite"></p>
<div class="grid" id="kpis" aria-live="polite"></div>
<h2 data-i18n="dash_candle_title">Velas del activo (últimas 120 sesiones sintéticas)</h2>
<div class="row"><div><label for="sel" data-i18n="asset">Activo</label><select id="sel"></select></div><div><label for="grp" data-i18n="filter_group">Filtrar tabla por grupo</label><select id="grp"><option value="" data-i18n="all">Todos</option></select></div></div>
<div id="chart" class="chart" role="img" data-i18n-aria="chart_asset" aria-label="Gráfico de velas del activo seleccionado"></div>
<h2 data-i18n="dash_universe">Universo de 26 activos</h2>
<div class="tw"><table><caption class="mut" style="text-align:left;padding:.4rem" data-i18n="dash_caption">Variaciones y riesgo (datos sintéticos)</caption><thead><tr><th scope="col" data-i18n="ticker">Ticker</th><th scope="col" class="l" data-i18n="group">Grupo</th><th scope="col" data-i18n="last">Último</th><th scope="col" data-i18n="day_1">1 d</th><th scope="col" data-i18n="day_5">5 d</th><th scope="col" data-i18n="month_1">1 m</th><th scope="col" data-i18n="month_3">3 m</th><th scope="col" data-i18n="annual_vol">Vol. anual</th><th scope="col" data-i18n="beta">Beta</th></tr></thead><tbody id="tb"></tbody></table></div>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
let D,O,ch,WL=[];
window.init=async()=>{ D=await loadJSON("10_dashboard_mercado.json"); O=await loadJSON("03_ohlcv_sintetico_120d.json"); const w0=await loadJSON("11_watchlist_alertas_portafolio_demo.json"); WL=EIA.watch()||w0.watchlist_inicial;
 $("#dashboard-alert-count").textContent=I18N.t("alerts",{n:(w0.alertas||[]).filter(a=>a.activa).length});
 $("#kpis").innerHTML=["SPY","QQQ","EPU"].map(t=>{const d=D.find(x=>x.ticker===t);return `<div class="card kpi"><div class="mut">${t} · ${d.nombre}</div><div class="v">${fmt.usd(d.ultimo)}</div><div class="${fmt.cls(d.var_1d_pct)}">${fmt.pct(d.var_1d_pct)} ${I18N.t("change_today")}</div></div>`}).join("");
 $("#sel").innerHTML=D.map(d=>`<option>${d.ticker}</option>`).join(""); const gs=[...new Set(D.map(d=>d.grupo))]; $("#grp").insertAdjacentHTML("beforeend",gs.map(g=>`<option>${g}</option>`).join(""));
 {const s0=EIA.ticker(); if(s0&&D.some(d=>d.ticker===s0)) $("#sel").value=s0;} $("#sel").onchange=()=>{EIA.setTicker($("#sel").value);draw()}; $("#grp").onchange=table; table(); draw(); window.addEventListener("resize",()=>ch&&ch.resize()); window.onTheme=draw; };
function table(){ const g=$("#grp").value; $("#tb").innerHTML=D.filter(d=>!g||d.grupo===g).map(d=>`<tr><th scope="row">${d.ticker}${WL.includes(d.ticker)?' <span aria-hidden="true">★</span><span class="sr-only"> (en su watchlist)</span>':''}</th><td class="l">${d.grupo}</td><td>${fmt.n(d.ultimo)}</td>${["var_1d_pct","var_5d_pct","var_1m_pct","var_3m_pct"].map(k=>`<td class="${fmt.cls(d[k])}">${fmt.pct(d[k])}</td>`).join("")}<td>${d.volatilidad_anual_pct} %</td><td>${d.beta_vs_SPY}</td></tr>`).join(""); }
function draw(){ const t=$("#sel").value,s=O.series[t]; const el=$("#chart"); if(!window.echarts){el.textContent="No se pudo cargar ECharts (se requiere conexión).";return}
 if(ch)ch.dispose(); ch=echarts.init(el); const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches); const tc=dark?"#e9eff5":"#14202e";
 ch.setOption({animation:false,textStyle:{color:tc},tooltip:{trigger:"axis"},grid:{left:55,right:15,top:20,bottom:45},xAxis:{type:"category",data:O.fechas,axisLabel:{color:tc}},yAxis:{scale:true,axisLabel:{color:tc},splitLine:{lineStyle:{color:dark?"#2c3a49":"#d3dce6"}}},
  dataZoom:[{type:"inside"},{type:"slider",height:18}],series:[{type:"candlestick",name:t,data:s.o.map((o,i)=>[o,s.c[i],s.l[i],s.h[i]]),itemStyle:{color:"#0a7d3c",color0:"#b3261e",borderColor:"#0a7d3c",borderColor0:"#b3261e"}}]}); }
</script></main></body></html>
