<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clasificación binaria de tendencia · Ernesto Investing AI</title>
<link rel="stylesheet" href="css/styles.css">
<style>
/* ===== Estilos propios del módulo Clasificación (usan las variables de styles.css) ===== */
/* Colores de texto/fondo para señales: contraste ≥ 4,5:1 en ambos temas */
:root{--upt:#07602f;--dnt:#9a1b14;--upbg:#dcf2e4;--dnbg:#fbe0dd;--onac:#fff}
:root[data-theme="dark"]{--upt:#52d18a;--dnt:#ff8a80;--upbg:#133a26;--dnbg:#4a1e1c;--onac:#0e141b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--upt:#52d18a;--dnt:#ff8a80;--upbg:#133a26;--dnbg:#4a1e1c;--onac:#0e141b}}

/* En tema oscuro el texto blanco sobre --ac no cumple AA: se usa texto oscuro */
nav a[aria-current="page"],button.primary,.btn.primary{color:var(--onac)}
nav a[aria-current="page"].nuevo::after{color:var(--onac)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top-aviso{margin:.5rem 0 1rem;color:var(--fg)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.pills{display:inline-flex;gap:.25rem;flex-wrap:wrap;padding:.25rem;border:1px solid var(--bd);border-radius:999px;background:var(--panel)}
.pills button{border-radius:999px;border-color:transparent;background:transparent;padding:.35rem .9rem;font-size:.9rem}
.pills button[aria-pressed="true"]{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:700}
.ctrl select{width:auto;min-width:11rem}

.kpis{display:grid;gap:1rem;grid-template-columns:1.4fr 1fr 1fr 1fr}
.kpis>*,.dual>*,.card{min-width:0}
.kpi .lbl{font-size:.78rem;color:var(--mut);margin:0}
.kpi .v{font-size:1.5rem;font-weight:700;margin:.25rem 0}
.kpi .sub{font-size:.85rem;color:var(--mut);margin:0}
.kpi .tit{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--ac);margin:0}
.dirup{color:var(--upt)}.dirdn{color:var(--dnt)}
.split{display:flex;height:.6rem;border-radius:999px;overflow:hidden;background:var(--hl);margin:.5rem 0 .3rem}
.split .s{background:var(--up)}.split .b{background:var(--dn)}
.cnt{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600}

.hm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.hm-head h2{margin:0}.hm-head p{margin:0}
.leg{display:flex;gap:.9rem;font-size:.82rem;font-weight:600}
.leg i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;vertical-align:-1px;margin-right:.3rem}
.leg .lb i{background:var(--dnbg);border:1px solid var(--dnt)}.leg .ls i{background:var(--upbg);border:1px solid var(--upt)}
.hm{margin-top:.75rem;max-height:30rem;overflow:auto;scroll-behavior:smooth;border:1px solid var(--bd);border-radius:10px;max-width:100%}
.hm table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.hm th,.hm td{padding:.3rem .35rem;border-bottom:1px solid var(--bd);text-align:center;background:var(--panel)}
.hm thead th{position:sticky;top:0;z-index:2;background:var(--hl);border-bottom:2px solid var(--bd)}
.hm tbody th{position:sticky;top:auto;left:0;z-index:1;text-align:left;min-width:10.5rem;font-weight:600;background:var(--panel);border-right:1px solid var(--bd)}
.hm thead th:first-child{left:0;z-index:3;text-align:left}
.hm th .fam{display:inline-block;margin-top:.15rem;font-size:.72rem;font-weight:700;padding:0 .4rem;border:1px solid var(--bd);border-radius:999px;color:var(--mut)}
.hm .th-b{display:block;width:100%;background:transparent;border:0;font-weight:700;font-size:.82rem;padding:.25rem .3rem;border-radius:6px;min-width:4.2rem}
.hm th.sel .th-b{background:var(--ac);color:var(--onac)}
.hm td.sel{background:var(--hl)}
.cell{display:block;width:100%;min-width:4.2rem;padding:.25rem .2rem;border-radius:6px;border:1px solid transparent;line-height:1.2;font-size:.82rem}
.cell b{display:block;font-size:.85rem}.cell span{display:block;font-size:.7rem;font-weight:700}
.cell.u{background:var(--upbg);color:var(--upt)}.cell.d{background:var(--dnbg);color:var(--dnt)}
.cell:hover{border-color:currentColor}
td.sel .cell{box-shadow:0 0 0 2px var(--ac)}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin:1.5rem 0 .5rem}
.sec-head h2{margin:0}
.dual{display:grid;gap:1rem;grid-template-columns:1fr 1fr}
.dual h3{font-size:1rem;margin:0 0 .8rem}
.mrow{display:grid;grid-template-columns:5.5rem 1fr 4rem;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.88rem}
.mrow .tr{height:.5rem;border-radius:999px;background:var(--hl);border:1px solid var(--bd);overflow:hidden}
.mrow .fl{height:100%;background:var(--ac)}
.mrow .pv{text-align:right;font-weight:700}
.nota{margin-top:1rem;padding:.6rem .8rem;background:var(--hl);border-radius:8px;color:var(--mut);font-size:.85rem}
.cm{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:.4rem;background:transparent;font-size:.85rem}
.cm th,.cm td{border:0;background:transparent;text-align:center;padding:.2rem;position:static}
.cm th[scope="row"]{text-align:left;width:5.5rem}
.cm td{border-radius:8px;padding:.7rem .3rem}
.cm td b{display:block;font-size:1.25rem}.cm td span{font-size:.78rem}
.cm td.ok{background:var(--upbg);color:var(--upt)}.cm td.ko{background:var(--dnbg);color:var(--dnt)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
.cta p{margin:0}
.cta a.btn{text-decoration:none;font-weight:700}

@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.dual{grid-template-columns:1fr}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.ctrl select{width:100%}.mrow{grid-template-columns:4.6rem 1fr 3.6rem}}
@media (prefers-reduced-motion:reduce){.hm{scroll-behavior:auto}}
</style>
</head>
<body data-page="clasificacion">
<main>
  <h1>Clasificación binaria de tendencia</h1>
  <p class="aviso top-aviso"><strong>Datos sintéticos · clasificación simulada.</strong> No constituye asesoría de inversión.</p>

  <!-- 2. Barra de controles -->
  <div class="ctrl">
    <div class="pills" id="pills" role="group" aria-label="Filtrar modelos por familia"></div>
    <div>
      <label for="selTicker" class="sr">Activo</label>
      <select id="selTicker"></select>
    </div>
  </div>

  <!-- 3. KPIs (aria-live para anunciar cambios) -->
  <section class="kpis" id="kpis" aria-label="Resumen de consenso"></section>

  <!-- 4. Mapa de calor -->
  <section class="card" style="margin-top:1rem" aria-labelledby="hmTit">
    <div class="hm-head">
      <div><h2 id="hmTit">Mapa de calor</h2><p class="mut" id="hmSub"></p></div>
      <div class="leg" aria-hidden="true"><span class="lb"><i></i>▼ BAJA</span><span class="ls"><i></i>▲ SUBE</span></div>
    </div>
    <div class="hm" id="hm" role="region" aria-label="Mapa de calor de probabilidades; desplazable" tabindex="0"></div>
  </section>

  <!-- 5. Métricas del modelo -->
  <div class="sec-head">
    <h2 id="mTit">Métricas específicas del modelo</h2>
    <div><label for="selModelo" class="sr">Modelo</label><select id="selModelo"></select></div>
  </div>
  <div class="dual">
    <section class="card" aria-labelledby="tMet"><h3 id="tMet"></h3><div id="met"></div><p class="nota" id="notaMet"></p></section>
    <section class="card" aria-labelledby="tCm"><h3 id="tCm"></h3><div id="cm"></div></section>
  </div>

  <!-- 6. Navegación contextual -->
  <section class="card cta" aria-label="Siguiente paso">
    <p id="ctaTxt"></p>
    <a class="btn primary" id="ctaBtn" href="regresion.html">Ver regresión →</a>
  </section>

  <!-- Regiones aria-live para lectores de pantalla -->
  <div class="sr" role="status" aria-live="polite" id="liveA"></div>
  <div class="sr" role="status" aria-live="polite" id="liveM"></div>
</main>
<script src="js/common.js"></script>
<script src="js/clasificacion.js"></script>
</body>
</html>
