<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="watch_title">Watchlist y alertas · Ernesto Investing AI</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="watchlist"><main>
<h1 data-i18n="watch_title">Watchlist y alertas</h1>
<div class="row"><div><label for="add" data-i18n="add_asset">Agregar activo</label><select id="add"></select></div><button id="bt" class="primary" type="button" data-i18n="add">Agregar</button></div>
<p id="watch-count" class="mut" role="status" aria-live="polite"></p>
<div class="tw" style="margin-top:1rem"><table><thead><tr><th scope="col" data-i18n="ticker">Ticker</th><th scope="col" data-i18n="last">Último</th><th scope="col" data-i18n="day_1">1 d</th><th scope="col" class="l" data-i18n="last_60">Últimas 60 sesiones</th><th scope="col" data-i18n="alert">Alerta</th><th scope="col" data-i18n="remove">Quitar</th></tr></thead><tbody id="tb"></tbody></table></div>
<h2 data-i18n="alerts_configured">Alertas configuradas</h2><ul id="al"></ul>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
let D,W,A,P;
window.init=async()=>{ D=await loadJSON("10_dashboard_mercado.json"); const w=await loadJSON("11_watchlist_alertas_portafolio_demo.json"); P=await loadJSON("02_precios_sinteticos_504d.json");
 W=store("eia_watch")||w.watchlist_inicial; A=w.alertas; $("#add").innerHTML=D.map(d=>`<option>${d.ticker}</option>`).join(""); $("#bt").onclick=()=>{const t=$("#add").value; if(!W.includes(t)){W.push(t);store("eia_watch",W);render()}}; render(); };
function spark(t){ const s=P.cierres[t].slice(-60), mn=Math.min(...s), mx=Math.max(...s); const pts=s.map((v,i)=>`${(i*3).toFixed(1)},${(28-28*(v-mn)/(mx-mn||1)).toFixed(1)}`).join(" "); return `<svg width="180" height="30" viewBox="0 0 180 30" role="img" aria-label="Últimas 60 sesiones de ${t}"><polyline fill="none" stroke="currentColor" stroke-width="1.6" points="${pts}"/></svg>`; }
function alertTxt(t,d){ const a=A.filter(x=>x.ticker===t&&x.activa); if(!a.length) return "—"; return a.map(x=>{ let ok=false; if(x.tipo==="precio_sobre")ok=d.ultimo>=x.umbral; if(x.tipo==="precio_bajo")ok=d.ultimo<=x.umbral; if(x.tipo==="var_1d_menor_a_pct")ok=d.var_1d_pct<=x.umbral; if(x.tipo==="var_1d_mayor_a_pct")ok=d.var_1d_pct>=x.umbral; return `<span class="tag">${x.tipo} ${x.umbral}${ok?" · "+I18N.t("alert_triggered"):""}</span>`}).join(" "); }
function render(){ $("#watch-count").textContent=I18N.t("watch_count",{n:W.length})+" · "+I18N.t("alerts",{n:A.filter(a=>a.activa).length}); $("#tb").innerHTML=W.map(t=>{const d=D.find(x=>x.ticker===t);return `<tr><th scope="row"><a href="clasificacion.html?ticker=${t}">${t}</a></th><td>${fmt.n(d.ultimo)}</td><td class="${fmt.cls(d.var_1d_pct)}">${fmt.pct(d.var_1d_pct)}</td><td class="l">${spark(t)}</td><td>${alertTxt(t,d)}</td><td><button type="button" data-q="${t}" aria-label="${I18N.t("remove_ticker",{ticker:t})}">✕</button></td></tr>`}).join("");
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{W=W.filter(x=>x!==b.dataset.q);store("eia_watch",W);render()});
 $("#al").innerHTML=A.map(a=>`<li>${a.ticker}: ${a.tipo} ${a.umbral} ${a.activa?"(activa)":"(inactiva)"}</li>`).join(""); }
</script></main></body></html>
